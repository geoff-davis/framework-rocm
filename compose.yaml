# docker compose config for the Framework Desktop ROCm containers.
#
#   docker compose build                       # build both images
#   docker compose build pytorch               # build just one
#   docker compose run --rm pytorch python /usr/local/bin/check_gpu.py
#   docker compose run --rm jax     python /usr/local/bin/check_jax.py
#   docker compose run --rm pytorch            # interactive shell
#
# Both services share the same GPU passthrough (via the YAML anchor below) —
# the device / group / security settings are what actually make the GPU visible
# inside the container, and matter as much as the image itself.

# Shared GPU access + mounts. ROCm needs the kernel fusion driver (/dev/kfd)
# and the DRI render nodes; the render/video groups own them; ROCm's userspace
# trips the default seccomp profile.
#
# The GIDs, and the host UID/GID for user mapping, come from a .env file:
# they're host-specific, and the container's group file usually has no
# `render`/`video` entry (passing the names fails with "unable to find group
# render"), so numeric GIDs are required. Copy .env.example to .env and fill it
# in — the one-liner in .env.example generates all four values. HOST_UID/GID
# default to 0 (root) if unset. (The run.sh wrapper needs no .env.)
x-rocm-gpu: &rocm-gpu
  devices:
    - /dev/kfd
    - /dev/dri
  group_add:
    - "${VIDEO_GID:?set VIDEO_GID in .env — copy .env.example}"
    - "${RENDER_GID:?set RENDER_GID in .env — copy .env.example}"
  # Map to the host user so mounted files aren't root-owned; 0:0 = root.
  user: "${HOST_UID:-0}:${HOST_GID:-0}"
  security_opt:
    - seccomp=unconfined
  ipc: host
  volumes:
    - ./workspace:/workspace
  stdin_open: true
  tty: true

# Base image tags default to the Dockerfile ARG (single source of truth).
# Override per build: docker compose build --build-arg ROCM_PYTORCH_TAG=<tag> pytorch
services:
  pytorch:
    <<: *rocm-gpu
    build:
      context: .
      dockerfile: Dockerfile
    image: framework-rocm:pytorch

  jax:
    <<: *rocm-gpu
    build:
      context: .
      dockerfile: Dockerfile.jax
    image: framework-rocm:jax
