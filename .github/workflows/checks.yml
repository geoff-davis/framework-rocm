name: checks

# Static, hardware-free checks — the GPU smoke tests need a gfx1151 machine and
# can't run on GitHub-hosted runners, so CI covers everything that doesn't.
on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run static checks
        run: ./scripts/check.sh
